spring.application.name=scalys
spring.profiles.default=dev
server.port=${SERVER_PORT:${PORT:2012}}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.sql.init.mode=never
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Private local videos for warranty requests; back up this directory together with PostgreSQL.
warranty.storage-dir=${WARRANTY_STORAGE_DIR:./local-warranty-videos}
# Public product photos uploaded by admins. Back up this directory with PostgreSQL.
product-image.storage-dir=${PRODUCT_IMAGE_STORAGE_DIR:./local-product-images}
# Set to neon on Render; keep filesystem for local development.
file-storage.backend=${FILE_STORAGE_BACKEND:filesystem}
file-storage.bucket=${FILE_STORAGE_BUCKET:scalys-files}
file-storage.endpoint=${AWS_ENDPOINT_URL_S3:}
file-storage.region=${AWS_REGION:}
file-storage.access-key=${AWS_ACCESS_KEY_ID:}
file-storage.secret-key=${AWS_SECRET_ACCESS_KEY:}
spring.servlet.multipart.max-file-size=90MB
spring.servlet.multipart.max-request-size=95MB

# VNPAY sandbox. Real credentials and callback URLs come from ignored local settings or environment.
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:}
vnpay.ipn-url=${VNPAY_IPN_URL:}
vnpay.local-return-confirm=${VNPAY_LOCAL_RETURN_CONFIRM:false}

# ZaloPay sandbox accepts local dev return URLs or a public HTTPS return URL.
zalopay.app-id=${ZALOPAY_APP_ID:}
zalopay.key1=${ZALOPAY_KEY1:}
zalopay.key2=${ZALOPAY_KEY2:}
zalopay.return-url=${ZALOPAY_RETURN_URL:http://localhost:2003/orders/zalopay-result}

# Email notifications are queued even before SMTP is configured.
shop.mail.enabled=${SHOP_MAIL_ENABLED:false}
shop.mail.from=${SHOP_MAIL_FROM:}
shop.contact.recipient=${SHOP_CONTACT_EMAIL:${SHOP_MAIL_FROM:}}
shop.public-url=${SHOP_PUBLIC_URL:http://localhost:2003}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
