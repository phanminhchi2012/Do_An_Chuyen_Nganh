<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#254633" />
    <meta name="description" content="Khám phá những người bạn bò sát tại Scalys, xem thông tin từng bé và gửi yêu cầu đặt hàng dễ dàng." />
    <title>Scalys | Thế giới thú cưng bò sát</title>
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('scalys-theme') === 'dark' ? 'dark' : 'light'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
