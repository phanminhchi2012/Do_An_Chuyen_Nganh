services:
  - type: web
    name: scalys-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: SERVER_ADDRESS
        value: 0.0.0.0
      - key: FILE_STORAGE_BACKEND
        value: neon
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: '3'
      - key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        value: '0'
      - key: SHOP_MAIL_ENABLED
        value: 'false'
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
